name: Deploy Telegram bot

# Manual only: Actions tab → "Deploy Telegram bot" → Run workflow.
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (already used by the trial deploy),
#   TELEGRAM_BOT_TOKEN (from @BotFather), MANAGER_CHAT_ID (optional: send /id to the bot).
# Replies are edited in telegram-bot/store.json.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-telegram-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy bot to Cloudflare Workers and set the Telegram webhook
        run: node scripts/deploy-telegram-bot.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MANAGER_CHAT_ID: ${{ secrets.MANAGER_CHAT_ID }}
