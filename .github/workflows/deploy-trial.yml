name: Deploy (trial)

# Manual only: Actions tab → "Deploy (trial)" → Run workflow.
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_ORG_SLUG, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   DEPLOY_MASTER_KEY (≥32 random chars; all app secrets are derived from it — never change it),
#   ADMIN_SETUP_TOKEN (≥24 random chars; entered once at /admin/setup).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trial
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Supabase + Cloudflare Workers
        run: npm run deploy:trial
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MASTER_KEY: ${{ secrets.DEPLOY_MASTER_KEY }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
